[build]
  command = "npm run build"
  publish = "dist"

# Proxy API + uploaded images to the Render backend.
# IMPORTANT: replace cityfix-backend.onrender.com with YOUR Render service URL.
[[redirects]]
  from = "/api/*"
  to = "https://cityfix-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://cityfix-backend.onrender.com/uploads/:splat"
  status = 200
  force = true

# SPA fallback (React Router) - keep this LAST.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
