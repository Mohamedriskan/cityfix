[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Route API calls to the serverless Express function (same origin, no CORS).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback (React Router) - keep this LAST.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
